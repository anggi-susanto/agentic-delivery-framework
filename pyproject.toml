[project]
name = "agentic-delivery-framework"
version = "0.1.0"
description = "Risk-calibrated workflows and evidence gates for coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Anggi Susanto" }]
dependencies = []

[tool.setuptools]
py-modules = []

[project.urls]
Homepage = "https://github.com/anggi-susanto/agentic-delivery-framework"
Repository = "https://github.com/anggi-susanto/agentic-delivery-framework"

[tool.unittest]
start-directory = "tests"
pattern = "test_*.py"

[tool.adf]
verification-command = "make verify"
